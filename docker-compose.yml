version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: healthcare_postgres
    restart: always
    environment:
      POSTGRES_DB: healthcare_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: healthcare_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_DIALECT: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: healthcare_db
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      JWT_SECRET: super_secret_healthcare_jwt_key_2026
      JWT_EXPIRES_IN: 24h
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
